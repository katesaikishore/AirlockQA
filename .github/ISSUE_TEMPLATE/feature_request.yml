name: Feature request
description: Propose a capability or integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - attach
        - flake
        - verify-merge
        - MCP / agents
        - GitHub / CI
        - evidence / attestations
        - cloud / console
        - other
    validations:
      required: true
