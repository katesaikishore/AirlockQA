# Weekly Airlock QA hunt over public repositories. It opens one pull request with the reports; it never opens a PR
# on the repositories it tests.
#
# Required secret: AIRLOCK_API_KEY (Airlock Cloud key). The report PR is opened in this repository with the
# workflow's own GITHUB_TOKEN.
name: Airlock QA hunt

on:
  schedule:
    # Mondays at 06:17 UTC; the date is deliberately not a round hour.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      max:
        description: 'How many repositories to scan (1-5)'
        required: false
        default: '3'

permissions:
  contents: write
  pull-requests: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run the hunt
        env:
          AIRLOCK_API_KEY: ${{ secrets.AIRLOCK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          MAX='${{ github.event.inputs.max || '3' }}'
          bun scripts/qa-hunt.ts --max "$MAX" --suites smoke,explore --create-pr

      - name: Upload the reports even if the PR step failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airlock-qa-hunt
          path: qa-hunt/
          if-no-files-found: warn
          retention-days: 30
