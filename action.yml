name: AirlockQA Attach + Flake
description: Attach the AirlockQA reporter to an existing Playwright suite, run it, and publish a flake report.
branding:
  icon: shield
  color: blue
inputs:
  project-dir:
    description: Repository directory containing playwright.config.ts
    required: false
    default: .
  reports-path:
    description: Airlock reporter output directory
    required: false
    default: .airlock/reports
  fail-on-flake:
    description: Fail the job when flaky tests are found
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Attach reporter
      shell: bash
      run: npx --yes airlockqa@latest attach "${{ inputs.project-dir }}"
    - name: Run Playwright
      shell: bash
      run: npx playwright test
    - name: Flake report
      shell: bash
      env:
        REPORTS_PATH: ${{ inputs.reports-path }}
        FAIL_ON_FLAKE: ${{ inputs.fail-on-flake }}
      run: |
        if [ "$FAIL_ON_FLAKE" = "true" ]; then
          npx --yes airlockqa@latest flake "$REPORTS_PATH" --markdown --fail-on-flake
        else
          npx --yes airlockqa@latest flake "$REPORTS_PATH" --markdown
        fi
